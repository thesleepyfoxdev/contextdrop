
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextdrop-service"
version = "0.1.0"
description = "A backend-independent context storage service with an async Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]

sdk = [
    "httpx>=0.27.0",
]

server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "anyio>=4.0",
]

storage-minio = [
    "minio>=7.2.0",
]

storage-s3 = [
    "boto3>=1.35.0",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "build",
]

[project.scripts]
contextdrop-server = "contextdrop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
